name: ugv-ag-v2
services:
  bridge:
    image: workspace2-communication:local
    pull_policy: never
    container_name: ugv-ag-v2
    network_mode: host
    user: "${AG_UID:?set AG_UID}:${AG_GID:?set AG_GID}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 20s
    environment:
      ROS_MASTER_URI: "${AG_MASTER_URI:-http://192.168.10.33:11311}"
      ROS_IP: "${AG_UGV_IP:-192.168.10.33}"
      AG_UAV_IP: "${AG_UAV_IP:-192.168.10.32}"
      AG_MONITOR_ONLY: "${AG_MONITOR_ONLY:-true}"
      HOME: /ag_runtime
      ROS_HOME: /ag_runtime/.ros
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - type: bind
        source: "${AG_RTK_ROOT:?set AG_RTK_ROOT}"
        target: /workspace
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${AG_NORTK_ROOT:?set AG_NORTK_ROOT}"
        target: /slicer
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${AG_OVERLAY_ROOT:?set AG_OVERLAY_ROOT}/install"
        target: /ag_v2_ws/install
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${AG_OVERLAY_ROOT:?set AG_OVERLAY_ROOT}/runtime"
        target: /ag_runtime
        bind: {create_host_path: false}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        source /opt/ros/noetic/setup.bash
        source /slicer/catkin_ws/devel/setup.bash
        source /workspace/install/setup.bash --extend
        source /ag_v2_ws/install/setup.bash
        exec roslaunch ag_ugv_task ugv.launch monitor_only:=$$AG_MONITOR_ONLY uav_ip:=$$AG_UAV_IP
